app:
  name: librecode
  env: development
  working_loader:
    text: Shenaniganing...

logging:
  level: info
  format: pretty

database:
  # Empty path resolves to ./.librecode/librecode.db when present, otherwise
  # ~/.librecode/librecode.db.
  path: ""
  apply_migrations: true
  # SQLite remains single-writer; keep one connection per process and let
  # busy_timeout wait for short writes from other librecode sessions.
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 30m
  busy_timeout: 15s

extensions:
  enabled: true
  # Extension sources use scheme:value syntax. Startup loads only entries listed
  # here; extra directories on disk are ignored unless explicitly declared.
  use:
    # Shorthand string form.
    - path:.librecode/extensions
    - official:vim-mode
    - github:example/librecode-extension
    - github:example/monorepo//extensions/fancy
    - path:/absolute/or/relative/extension

    # Object form with version pinning.
    - source: official:vim-mode
      version: v0.1.0
    - source: github:example/librecode-extension
      version: v1.2.3

assistant:
  provider: openai-codex
  model: gpt-5.6-sol
  thinking_level: off
  retry:
    enabled: true
    max_attempts: 3
    base_delay: 2s
    max_delay: 30s

delegation:
  # Optional model for durable subagents. When set, agent tasks fall back
  # to this model instead of the assistant model, unless a specific agent
  # profile overrides it. provider and model must be set together.
  provider: ""
  model: ""
  thinking_level: ""

context:
  preflight_enabled: true
  # Controls automatic pre-request and post-response compaction. Provider
  # overflow recovery and manual /compact remain available when disabled.
  auto_compaction_enabled: true
  # Percentage of usable input that triggers post-response compaction.
  auto_compaction_threshold: 80
  # Dynamic retained context is capped at this many tokens.
  retained_tail_max_tokens: 64000
  # 0 selects the bounded default; configured values are clamped to model/reserve limits.
  summary_output_tokens: 0
  # Optional dedicated summary model; provider and model must be set together.
  compaction_provider: ""
  compaction_model: ""
  # Aggregate token limit for extension-provided context blocks.
  extension_contribution_tokens: 8192
  # 0 uses the selected model max_tokens, otherwise 16k capped at 20% of context.
  output_reserve_tokens: 0
  provider_reserve_tokens: 2048
  safety_margin_tokens: 8192

models:
  discovery:
    enabled: true
    source_url: https://models.dev/api.json
    cache_ttl: 24h
    fetch_timeout: 10s

cache:
  enabled: true
  capacity: 512
  ttl: 10m

tasks:
  # Durable subagents, workflows, and background tools share this worker pool.
  workers: 4
  poll_interval: 250ms
  lease_duration: 30s
  heartbeat_interval: 10s
  recovery_interval: 30s
  default_timeout: 30m
  max_timeout: 2h
  max_outcome_bytes: 262144


# Built-in hard limits protect memory usage for untrusted input/remote bodies:
# - prompt stdin: 1 MiB
# - `librecode tool run ... -` JSON stdin: 1 MiB
# - provider response/error bodies: 16 MiB
